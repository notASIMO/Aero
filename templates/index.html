<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>AERO OS // COMMAND DECK</title>
    <style>
        :root { --glass: rgba(10,16,28,0.75); --glass-border: rgba(0,240,255,0.22); --cyan: #00f0ff; --emerald: #00ff9d; --danger: #ff3b5c; }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #04070d; height: 100vh; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; padding: 12px; transition: opacity 0.35s ease; }
        body.transparent-mode { opacity: 0.25; } body.transparent-mode:hover { opacity: 1.0; }
        .deck { width: 100%; height: 100%; background: var(--glass); backdrop-filter: blur(16px); border: 1px solid var(--glass-border); border-radius: 14px; display: flex; flex-direction: column; padding: 12px; gap: 8px; }
        .header { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--cyan); font-family: 'Consolas', monospace; }
        .header-right { display: flex; align-items: center; gap: 6px; }
        .token-pill { background: rgba(0,255,157,0.12); border: 1px solid rgba(0,255,157,0.35); color: var(--emerald); padding: 3px 7px; border-radius: 6px; font-size: 9px; }
        .off-btn { background: rgba(255,59,92,0.15); border: 1px solid var(--danger); color: var(--danger); border-radius: 6px; padding: 3px 8px; font-size: 9px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .off-btn:hover { background: var(--danger); color: #fff; }
        .sub-bar { display: flex; justify-content: space-between; font-size: 9px; color: #64748b; font-family: 'Consolas', monospace; padding: 2px 4px; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
        .card { background: rgba(15,23,42,0.7); border: 1px solid rgba(255,255,255,0.06); border-radius: 8px; padding: 7px 10px; }
        .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
        .card-name { font-size: 10px; font-weight: bold; color: var(--cyan); font-family: 'Consolas', monospace; }
        .card-status { font-size: 8px; color: var(--emerald); font-family: 'Consolas', monospace; }
        .card-task { font-size: 9px; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .feed { flex: 1; background: rgba(3,5,10,0.8); border: 1px solid rgba(0,240,255,0.12); border-radius: 8px; padding: 8px; overflow-y: auto; font-size: 9.5px; color: #a5f3fc; line-height: 1.45; font-family: 'Consolas', monospace; }
        .input-bar { display: flex; gap: 6px; }
        .box { flex: 1; background: rgba(15,23,42,0.9); border: 1px solid rgba(255,255,255,0.12); border-radius: 6px; padding: 7px 10px; color: #fff; font-size: 11px; outline: none; }
        .box:focus { border-color: var(--cyan); }
        .btn { background: var(--cyan); color: #000; border: none; border-radius: 6px; padding: 0 14px; font-weight: bold; font-size: 10px; cursor: pointer; }
    </style>
</head>
<body id="body" onclick="document.getElementById('body').classList.remove('transparent-mode')">
    <div class="deck">
        <div class="header">
            <span>⚡ AERO // NEURAL OS</span>
            <div class="header-right"><span class="token-pill" id="token-badge">0 GEMINI // ∞ FREE</span><button class="off-btn" onclick="fetch('/shutdown',{method:'POST'});window.close()">✕ OFF</button></div>
        </div>
        <div class="sub-bar"><span>WAKE: ALT+SPACE</span><span>KILL DAEMON: ALT+Q</span></div>
        <div class="grid" id="grid"></div><div class="feed" id="feed"></div>
        <div class="input-bar"><input type="text" class="box" id="inp" placeholder="Issue directive..." onkeydown="if(event.key==='Enter') sendCmd()"><button class="btn" onclick="sendCmd()">GO</button></div>
    </div>
    <script>
        const agents = ["AERO", "ATLAS", "NOVA", "SENTINEL", "PULSE", "VIBE"];
        const grid = document.getElementById("grid");
        agents.forEach(ag => grid.innerHTML += `<div class="card"><div class="card-top"><span class="card-name">${ag}</span><span class="card-status" id="status-${ag}">IDLE</span></div><div class="card-task" id="task-${ag}">Standby</div></div>`);
        async function poll() {
            try {
                let d = await (await fetch('/state')).json();
                if(d.telemetry) document.getElementById("token-badge").innerText = `${d.telemetry.current_model.toUpperCase()} (${d.telemetry.tokens_remaining})`;
                document.getElementById("body").classList.toggle("transparent-mode", d.active_mode === "transparent");
                let f = document.getElementById("feed"); f.innerHTML = d.logs.join('<br>'); f.scrollTop = f.scrollHeight;
                for(let [id, st] of Object.entries(d.agents)){
                    let t=document.getElementById(`task-${id}`), s=document.getElementById(`status-${id}`);
                    if(t) t.innerText = st.task; if(s){ s.innerText = st.status; s.style.color = st.color; }
                }
            }catch(e){}
        }
        setInterval(poll, 600);
        async function sendCmd() {
            let b = document.getElementById("inp"), c = b.value.trim(); if(!c) return; b.value = "";
            await fetch('/deploy', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({command: c})});
        }
    </script>
</body>
</html>
